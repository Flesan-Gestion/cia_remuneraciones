# ============================================================
# Mockup Plataforma — docker-compose
# Solo el servicio web. Si esta plataforma necesita Postgres u otro
# servicio, agrégalo aquí y suma DATABASE_URL al .env (ver docs/ARQUITECTURA.md).
# ============================================================

services:
  web:
    container_name: liquidaciones-sap
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # PORT del .env (default 3000 si no está seteado — confirmar con el equipo de
      # infraestructura que el puerto elegido esté libre en la VM antes de desplegar).
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0

    healthcheck:
      # Forma shell (no exec-array) para que $PORT tome el valor real del
      # contenedor. 127.0.0.1, no "localhost": ver nota en Dockerfile
      # (resuelve a IPv6 en Alpine).
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$$PORT/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
